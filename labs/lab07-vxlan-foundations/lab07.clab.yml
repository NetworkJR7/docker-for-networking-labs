name: lab07

mgmt:
  network: clab07
  ipv4-subnet: 172.30.70.0/24

topology:
  nodes:

    leaf1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./configs/leaf1:/etc/frr

    leaf2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./configs/leaf2:/etc/frr

    host1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.100.10/24 dev eth1
        - ip link set eth1 up

    host2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.100.20/24 dev eth1
        - ip link set eth1 up

  links:

    # Underlay
    - endpoints:
        - leaf1:eth1
        - leaf2:eth1

    # Host1 access
    - endpoints:
        - host1:eth1
        - leaf1:eth2

    # Host2 access
    - endpoints:
        - host2:eth1
        - leaf2:eth2
