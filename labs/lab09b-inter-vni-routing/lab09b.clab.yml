name: lab09b

mgmt:
  network: clab09b
  ipv4-subnet: 172.30.91.0/24

topology:
  nodes:

    leaf1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./configs/leaf1:/etc/frr

    spine:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./configs/spine:/etc/frr

    leaf2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ./configs/leaf2:/etc/frr

    hosta:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.100.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.168.100.1

    hostb:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.200.10/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.168.200.1

    hostc:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.100.20/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.168.100.1

    hostd:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.200.20/24 dev eth1
        - ip link set eth1 up
        - ip route replace default via 192.168.200.1

  links:

    # Underlay
    - endpoints:
        - leaf1:eth1
        - spine:eth1

    - endpoints:
        - spine:eth2
        - leaf2:eth1

    # Leaf1 access
    - endpoints:
        - hosta:eth1
        - leaf1:eth2

    - endpoints:
        - hostb:eth1
        - leaf1:eth3

    # Leaf2 access
    - endpoints:
        - hostc:eth1
        - leaf2:eth2

    - endpoints:
        - hostd:eth1
        - leaf2:eth3
