frr defaults traditional
hostname FRR2
service integrated-vtysh-config
!
interface lo
 ip address 2.2.2.2/32
!
route-map PERMIT-ALL permit 10
!
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 10.10.14.2 remote-as 65001
 !
 address-family ipv4 unicast
  neighbor 10.10.14.2 route-map PERMIT-ALL in
  neighbor 10.10.14.2 route-map PERMIT-ALL out 

 network 2.2.2.2/32
 exit-address-family
!
line vty
!
